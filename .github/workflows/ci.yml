name: Quality checks

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Build SSR container
        run: docker build --tag news-list-ssr:ci .

      - name: Smoke-test SSR container
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 3000:3000 news-list-ssr:ci)"
          trap 'docker rm --force "$container_id" >/dev/null' EXIT

          ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/robots.txt >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != true ]]; then
            docker logs "$container_id"
            exit 1
          fi

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/)" = "302"
